<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إدارة موقع krater360 | المحرر</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    :root {
      --blue: #0f4e9a;
      --blue2: #1f5fa8;
      --red: #c62828;
      --bg: #f2f5ff;
      --card: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: #1e293b;
    }
    header {
      background: linear-gradient(180deg, var(--blue), var(--blue2));
      color: #fff;
      padding: 18px 16px;
      text-align: center;
    }
    header h1 {
      margin: 0;
      font-size: 24px;
    }
    header p {
      margin: 6px 0 0;
      font-size: 13px;
      color: #d7e6ff;
    }
    .wrap {
      max-width: 860px;
      margin: 18px auto;
      padding: 0 14px 40px;
    }
    .login-box, .admin-panel {
      background: var(--card);
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 8px 22px rgba(0,0,0,.08);
      border: 1px solid #dbeafe;
    }
    .login-box {
      max-width: 400px;
      margin: 40px auto;
      text-align: center;
    }
    .admin-panel { display: none; }
    .admin-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    @media (max-width: 700px) {
      .admin-grid { grid-template-columns: 1fr; }
    }
    .admin-box {
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .admin-box h4 {
      margin: 0 0 8px;
      color: #0f4e9a;
      font-size: 15px;
    }
    label {
      display: block;
      font-size: 12px;
      margin-top: 8px;
      color: #475569;
      font-weight: 600;
    }
    input, textarea {
      width: 100%;
      padding: 9px 10px;
      margin-top: 4px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-family: inherit;
      font-size: 14px;
    }
    .phone-upload-box {
      margin-top: 8px;
      padding: 8px;
      background: #eef4ff;
      border: 1px dashed #1f5fa8;
      border-radius: 6px;
    }
    .btn {
      border: none;
      border-radius: 6px;
      padding: 9px 15px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      color: #fff;
    }
    .btn-blue { background: #1f5fa8; }
    .btn-green { background: #2e7d32; }
    .btn-gray { background: #64748b; }
    .btn-red { background: #c62828; }
    .upload-status-msg {
      margin: 5px 0 0;
      font-size: 12px;
      font-weight: 600;
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin: 14px 0;
    }
    .tabs button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
    }
    .post-row {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .actions-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<header>
  <h1>لوحة تحرير وإدارة موقع k360</h1>
  <p>نشر الأخبار وإدارة الإعلانات والرسائل</p>
</header>

<div class="wrap">
  <div class="login-box" id="loginBox">
    <h3 style="margin-top:0; color:#0f4e9a;">تسجيل الدخول للإدارة</h3>
    <input type="password" id="passInput" placeholder="أدخل رمز الإدارة">
    <button type="button" class="btn btn-blue" style="width:100%; margin-top:12px;" onclick="checkLogin()">دخول</button>
  </div>

  <div class="admin-panel" id="adminPanel">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; flex-wrap:wrap; gap:8px;">
      <a href="https://krater360.github.io/" target="_blank" class="btn btn-blue" style="text-decoration:none;">عرض الموقع الرئيسي</a>
      <button type="button" class="btn btn-red" onclick="logoutAdmin()">تسجيل خروج</button>
    </div>

    <div class="admin-box">
      <h4>نشر خبر جديد (يُحفظ في Firebase ويظهر أولاً)</h4>
      <label>عنوان الخبر</label>
      <input type="text" id="newPostTitle" placeholder="اكتب عنوان الخبر هنا...">
      <label>رابط الصورة (اختياري)</label>
      <input type="url" id="newPostImg" placeholder="https://krater360.github.io/images/...">
      <div class="phone-upload-box">
        <label style="margin-top:0;">إدراج صورة للخبر من الهاتف:</label>
        <input type="file" id="newPostFile" accept="image/*">
        <button type="button" class="btn btn-blue" style="margin-top:6px;" onclick="uploadPhoneImage('newPostFile', 'newPostImg', 'newPostUploadStatus')">رفع صورة الخبر من الهاتف</button>
        <p class="upload-status-msg" id="newPostUploadStatus"></p>
      </div>
      <label>تاريخ الخبر</label>
      <input type="date" id="newPostDate">
      <label>نص الخبر (كل سطر يصبح فقرة)</label>
      <textarea id="newPostBody" rows="5" placeholder="اكتب تفاصيل الخبر هنا..."></textarea>
      <div class="actions-bar">
        <button type="button" class="btn btn-green" onclick="publishNewPost()">نشر الخبر الآن</button>
      </div>
    </div>

    <div class="admin-grid">
      <div class="admin-box">
        <h4>إعلان رأس الصفحة (يمين)</h4>
        <label>نص الإعلان</label>
        <input type="text" id="adRightText" placeholder="مثال: أعلن معنا الآن">
        <label>رابط الصورة (اختياري)</label>
        <input type="url" id="adRightImg" placeholder="https://...">
        <div class="phone-upload-box">
          <label style="margin-top:0;">تحميل صورة الإعلان من الهاتف:</label>
          <input type="file" id="adRightFile" accept="image/*">
          <button type="button" class="btn btn-blue" style="margin-top:6px;" onclick="uploadPhoneImage('adRightFile', 'adRightImg', 'adRightUploadStatus')">رفع صورة الإعلان (يمين)</button>
          <p class="upload-status-msg" id="adRightUploadStatus"></p>
        </div>
        <label>رابط الوجهة عند النقر</label>
        <input type="url" id="adRightUrl" placeholder="https://...">
      </div>

      <div class="admin-box">
        <h4>إعلان رأس الصفحة (يسار)</h4>
        <label>نص الإعلان</label>
        <input type="text" id="adLeftText" placeholder="مثال: تغطية خاصة">
        <label>رابط الصورة (اختياري)</label>
        <input type="url" id="adLeftImg" placeholder="https://...">
        <div class="phone-upload-box">
          <label style="margin-top:0;">تحميل صورة الإعلان من الهاتف:</label>
          <input type="file" id="adLeftFile" accept="image/*">
          <button type="button" class="btn btn-blue" style="margin-top:6px;" onclick="uploadPhoneImage('adLeftFile', 'adLeftImg', 'adLeftUploadStatus')">رفع صورة الإعلان (يسار)</button>
          <p class="upload-status-msg" id="adLeftUploadStatus"></p>
        </div>
        <label>رابط الوجهة عند النقر</label>
        <input type="url" id="adLeftUrl" placeholder="https://...">
      </div>
    </div>

    <div class="actions-bar" style="margin-bottom:14px;">
      <button type="button" class="btn btn-green" onclick="saveAdsConfig()">حفظ وتعديل الإعلانات</button>
      <button type="button" class="btn btn-gray" onclick="resetGithubToken()">تغيير / مسح Token</button>
    </div>

    <div class="tabs">
      <button type="button" id="tabPostsBtn" style="background:#0f4e9a; color:#fff;" onclick="switchTab('posts')">📰 المنشورات المنشورة</button>
      <button type="button" id="tabMsgBtn" style="background:#e2e8f0; color:#1e293b;" onclick="switchTab('messages')">📩 الرسائل الواردة (<span id="msgCount">0</span>)</button>
    </div>

    <div class="admin-box" id="postsSection">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <h4 style="margin:0;">الأخبار المحفوظة في قاعدة البيانات</h4>
        <button type="button" class="btn btn-gray" onclick="loadPostsList()">تحديث</button>
      </div>
      <div id="postsList">جاري التحميل...</div>
    </div>

    <div class="admin-box" id="messagesSection" style="display:none;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <h4 style="margin:0;">رسائل زوار موقع k360</h4>
        <button type="button" class="btn btn-green" onclick="loadMessages()">تحديث</button>
      </div>
      <div id="messagesList">جاري التحميل...</div>
    </div>
  </div>
</div>

<script>
const FIREBASE_DB_URL = "https://krater360-2019f-default-rtdb.firebaseio.com";
const ADMIN_PASSCODE = "9270268911";
const GITHUB_OWNER = "krater360";
const GITHUB_REPO = "krater360.github.io";
const GITHUB_BRANCH = "main";
const GITHUB_FOLDER = "images";
const TOKEN_STORAGE_KEY = "krater360_gh_token_new";

function checkLogin() {
  const val = document.getElementById("passInput").value.trim();
  if (val === ADMIN_PASSCODE) {
    sessionStorage.setItem("k360_editor_auth", "1");
    showPanel();
  } else {
    alert("رمز الإدارة غير صحيح");
  }
}

function logoutAdmin() {
  sessionStorage.removeItem("k360_editor_auth");
  location.reload();
}

function showPanel() {
  document.getElementById("loginBox").style.display = "none";
  document.getElementById("adminPanel").style.display = "block";
  document.getElementById("newPostDate").value = getAdenTodayISO();
  loadAdsConfig();
  loadPostsList();
  loadMessages();
}

function escapeText(str) {
  return String(str || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function getAdenTodayISO() {
  try {
    const parts = new Intl.DateTimeFormat("en-CA", {
      timeZone: "Asia/Aden",
      year: "numeric",
      month: "2-digit",
      day: "2-digit"
    }).formatToParts(new Date());
    const y = parts.find(p => p.type === "year")?.value || "2026";
    const m = parts.find(p => p.type === "month")?.value || "11";
    const d = parts.find(p => p.type === "day")?.value || "25";
    return `${y}-${m}-${d}`;
  } catch (_) {
    return new Date().toISOString().slice(0, 10);
  }
}

function cleanGithubTokenValue(raw) {
  return String(raw || "").replace(/[^A-Za-z0-9_]/g, "").trim();
}

function getSavedGithubToken(forcePrompt = false) {
  let token = cleanGithubTokenValue(localStorage.getItem(TOKEN_STORAGE_KEY));
  if (!token || forcePrompt) {
    const entered = prompt("أدخل رمز GitHub Token الخاص برفع الصور:", token);
    if (entered === null) return "";
    const clean = cleanGithubTokenValue(entered);
    if (clean) {
      localStorage.setItem(TOKEN_STORAGE_KEY, clean);
      token = clean;
    } else {
      alert("الرمز المدخل غير صالح.");
      return "";
    }
  }
  return token;
}

function resetGithubToken() {
  localStorage.removeItem(TOKEN_STORAGE_KEY);
  const t = getSavedGithubToken(true);
  if (t) alert("تم حفظ التوكن الجديد بنجاح.");
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result || "").split(",")[1] || "");
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function uploadPhoneImage(fileInputId, targetUrlInputId, statusElId) {
  const fileInput = document.getElementById(fileInputId);
  const urlInput = document.getElementById(targetUrlInputId);
  const statusEl = document.getElementById(statusElId);

  if (!fileInput.files || !fileInput.files.length) {
    statusEl.style.color = "#c62828";
    statusEl.textContent = "اختر صورة من الهاتف أولاً.";
    return;
  }
  const file = fileInput.files[0];
  const token = getSavedGithubToken();
  if (!token) return;

  statusEl.style.color = "#0f4e9a";
  statusEl.textContent = "جاري رفع الصورة...";

  try {
    const base64Content = await fileToBase64(file);
    const ext = (file.name.split(".").pop() || "jpg").replace(/[^a-zA-Z0-9]/g, "") || "jpg";
    const fileName = `${Date.now()}-img.${ext}`;
    const apiUrl = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_FOLDER}/${fileName}`;

    const res = await fetch(apiUrl, {
      method: "PUT",
      headers: {
        "Authorization": `Bearer ${token}`,
        "Accept": "application/vnd.github+json",
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: `Upload ${fileName}`,
        content: base64Content,
        branch: GITHUB_BRANCH
      })
    });
    if (!res.ok) throw new Error("فشل الرفع إلى GitHub");

    urlInput.value = `https://${GITHUB_OWNER}.github.io/${GITHUB_FOLDER}/${fileName}`;
    statusEl.style.color = "#2e7d32";
    statusEl.textContent = "تم رفع الصورة وإدراج رابطها بنجاح.";
  } catch (e) {
    statusEl.style.color = "#c62828";
    statusEl.textContent = "خطأ أثناء الرفع: " + e.message;
  }
}

function publishNewPost() {
  const titleEl = document.getElementById("newPostTitle");
  const imgEl = document.getElementById("newPostImg");
  const dateEl = document.getElementById("newPostDate");
  const bodyEl = document.getElementById("newPostBody");

  const title = titleEl.value.trim();
  const img = imgEl.value.trim();
  const rawDate = dateEl.value.trim() || getAdenTodayISO();
  const paragraphs = bodyEl.value.trim().split(/\n+/).map(p => p.trim()).filter(Boolean);

  if (!title || !paragraphs.length) {
    alert("يرجى إدخال عنوان الخبر ونصه.");
    return;
  }

  const id = "news-" + Date.now();
  const postData = { id, title, img, date: rawDate, paragraphs, createdAt: Date.now() };

  fetch(`${FIREBASE_DB_URL}/posts/${encodeURIComponent(id)}.json`, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(postData)
  })
    .then(r => {
      if (!r.ok) throw new Error();
      titleEl.value = "";
      imgEl.value = "";
      bodyEl.value = "";
      dateEl.value = getAdenTodayISO();
      loadPostsList();
      alert("تم نشر الخبر في الموقع بنجاح.");
    })
    .catch(() => alert("تعذر نشر الخبر، تحقق من الاتصال."));
}

function loadAdsConfig() {
  fetch(`${FIREBASE_DB_URL}/settings/headerAds.json`)
    .then(r => r.json())
    .then(data => {
      if (!data) return;
      document.getElementById("adRightText").value = data.right?.text || "";
      document.getElementById("adRightImg").value = data.right?.img || "";
      document.getElementById("adRightUrl").value = data.right?.url || "";
      document.getElementById("adLeftText").value = data.left?.text || "";
      document.getElementById("adLeftImg").value = data.left?.img || "";
      document.getElementById("adLeftUrl").value = data.left?.url || "";
    }).catch(() => {});
}

function saveAdsConfig() {
  const payload = {
    right: {
      text: document.getElementById("adRightText").value.trim(),
      img: document.getElementById("adRightImg").value.trim(),
      url: document.getElementById("adRightUrl").value.trim()
    },
    left: {
      text: document.getElementById("adLeftText").value.trim(),
      img: document.getElementById("adLeftImg").value.trim(),
      url: document.getElementById("adLeftUrl").value.trim()
    }
  };
  fetch(`${FIREBASE_DB_URL}/settings/headerAds.json`, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  })
    .then(() => alert("تم حفظ الإعلانات بنجاح"))
    .catch(() => alert("تعذر الحفظ"));
}

function loadPostsList() {
  const listEl = document.getElementById("postsList");
  fetch(`${FIREBASE_DB_URL}/posts.json`)
    .then(r => r.json())
    .then(data => {
      if (!data) {
        listEl.innerHTML = "<p>لا توجد منشورات ديناميكية بعد.</p>";
        return;
      }
      const items = Object.values(data).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
      listEl.innerHTML = items.map(p => `
        <div class="post-row">
          <div>
            <strong>${escapeText(p.title)}</strong>
            <div style="font-size:12px; color:#64748b;">${escapeText(p.date || "")}</div>
          </div>
          <button type="button" class="btn btn-red" onclick="deleteFirebasePost('${escapeText(p.id)}')">حذف</button>
        </div>
      `).join("");
    }).catch(() => { listEl.innerHTML = "<p>تعذر التحميل.</p>"; });
}

function deleteFirebasePost(id) {
  if (!confirm("حذف هذا الخبر نهائياً؟")) return;
  fetch(`${FIREBASE_DB_URL}/posts/${encodeURIComponent(id)}.json`, { method: "DELETE" })
    .then(() => loadPostsList());
}

function switchTab(tab) {
  const isMsg = tab === "messages";
  document.getElementById("postsSection").style.display = isMsg ? "none" : "block";
  document.getElementById("messagesSection").style.display = isMsg ? "block" : "none";
  document.getElementById("tabPostsBtn").style.background = isMsg ? "#e2e8f0" : "#0f4e9a";
  document.getElementById("tabPostsBtn").style.color = isMsg ? "#1e293b" : "#fff";
  document.getElementById("tabMsgBtn").style.background = isMsg ? "#0f4e9a" : "#e2e8f0";
  document.getElementById("tabMsgBtn").style.color = isMsg ? "#fff" : "#1e293b";
}

function loadMessages() {
  const box = document.getElementById("messagesList");
  fetch(`${FIREBASE_DB_URL}/siteMessages.json`)
    .then(r => r.json())
    .then(data => {
      if (!data) {
        document.getElementById("msgCount").textContent = "0";
        box.innerHTML = "<p>لا توجد رسائل.</p>";
        return;
      }
      const list = Object.values(data).sort((a, b) => new Date(b.sentAt || 0) - new Date(a.sentAt || 0));
      document.getElementById("msgCount").textContent = String(list.length);
      box.innerHTML = list.map(m => `
        <div class="post-row" style="display:block;">
          <strong>${escapeText(m._subject || "رسالة")}</strong> — <span style="color:#0f4e9a;">${escapeText(m.name || "")}</span>
          <div style="font-size:11px; color:#64748b; margin:4px 0;">${escapeText(m.email || "")}</div>
          <p style="margin:6px 0 0; white-space:pre-line;">${escapeText(m.message || "")}</p>
        </div>
      `).join("");
    }).catch(() => { box.innerHTML = "<p>تعذر تحميل الرسائل.</p>"; });
}

if (sessionStorage.getItem("k360_editor_auth") === "1") {
  showPanel();
}
</script>
</body>
</html>
