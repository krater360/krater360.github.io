<style>
  .k360-contact-box {
    max-width: 680px;
    margin: 24px auto;
    background: #ffffff;
    border: 1px solid #cbd5e1;
    border-top: 4px solid #0d47a1;
    border-radius: 10px;
    padding: 18px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.06);
    font-family: "Segoe UI", Tahoma, Arial, sans-serif;
    color: #1e293b;
  }
  .k360-contact-box h3 {
    margin: 0 0 6px;
    color: #0d47a1;
    font-size: 18px;
  }
  .k360-contact-hint {
    margin: 0 0 14px;
    font-size: 12px;
    color: #475569;
  }
  .k360-field {
    margin-bottom: 12px;
  }
  .k360-field label {
    display: block;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 5px;
    color: #334155;
  }
  .k360-field input,
  .k360-field textarea {
    width: 100%;
    box-sizing: border-box;
    padding: 9px 11px;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    font-family: inherit;
    font-size: 14px;
  }
  .k360-submit-btn {
    background: #0d47a1;
    color: #ffffff;
    border: none;
    border-radius: 6px;
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }
  .k360-submit-btn:hover {
    background: #1f5fa8;
  }
  .k360-msg-status {
    margin-top: 10px;
    font-size: 13px;
    font-weight: 700;
  }
</style>

<div class="k360-contact-box" id="k360ContactSection">
  <h3>تواصل معنا أو أرسل تعليقاً</h3>
  <p class="k360-contact-hint">يُشترط إدخال بريد Gmail معروف وصحيح (@gmail.com) ولن تُقبل العناوين العشوائية أو القصيرة.</p>

  <form id="k360ContactForm" onsubmit="submitValidatedMessage(event)">
    <div class="k360-field">
      <label for="senderName">الاسم الكامل</label>
      <input type="text" id="senderName" required minlength="3" placeholder="اكتب اسمك هنا">
    </div>

    <div class="k360-field">
      <label for="senderEmail">بريد Gmail المعروف</label>
      <input type="email" id="senderEmail" required placeholder="example@gmail.com">
    </div>

    <div class="k360-field">
      <label for="senderSubject">الموضوع</label>
      <input type="text" id="senderSubject" placeholder="مثال: تعليق أو استفسار">
    </div>

    <div class="k360-field">
      <label for="senderMessage">نص الرسالة أو التعليق</label>
      <textarea id="senderMessage" rows="4" required minlength="5" placeholder="اكتب رسالتك أو تعليقك هنا..."></textarea>
    </div>

    <button type="submit" class="k360-submit-btn" id="sendMsgBtn">إرسال</button>
    <div class="k360-msg-status" id="contactStatusMsg"></div>
  </form>
</div>
<script>
const CONTACT_FIREBASE_URL = "https://krater360-2019f-default-rtdb.firebaseio.com";

function validateKnownGmail(rawEmail) {
  const email = String(rawEmail || "").trim().toLowerCase();

  if (!email.endsWith("@gmail.com")) {
    return { ok: false, reason: "يُسمح فقط ببريد Gmail الذي ينتهي بـ @gmail.com." };
  }

  const parts = email.split("@");
  if (parts.length !== 2) {
    return { ok: false, reason: "صيغة البريد الإلكتروني غير صحيحة." };
  }

  const localPart = parts[0];

  if (!/^[a-z0-9._-]+$/.test(localPart)) {
    return { ok: false, reason: "اسم المستخدم في البريد يحتوي على رموز غير مسموحة." };
  }

  if (localPart.startsWith(".") || localPart.endsWith(".") || localPart.includes("..")) {
    return { ok: false, reason: "تنسيق النقاط في البريد الإلكتروني غير صحيح." };
  }

  if (localPart.length < 4) {
    return { ok: false, reason: "البريد قصير جداً؛ يرجى إدخال بريد Gmail معروف." };
  }

  if (/^\d+$/.test(localPart)) {
    return { ok: false, reason: "لا يُقبل بريد مكون من أرقام فقط؛ أدخل بريداً معروفاً." };
  }

  if (/(.)\1{3,}/.test(localPart)) {
    return { ok: false, reason: "البريد يبدو عشوائياً؛ يرجى إدخال بريد Gmail معروف." };
  }

  const blockedWords = [
    "test", "fake", "spam", "temp", "dummy", "asdf", "qwerty",
    "abc", "abcd", "1234", "12345", "noreply", "no-reply", "admin", "user"
  ];
  if (blockedWords.some(word => localPart === word || localPart.includes(word))) {
    return { ok: false, reason: "يرجى استخدام بريد Gmail حقيقي ومعروف وليس عشوائياً أو تجريبياً." };
  }

  return { ok: true, email };
}

function submitValidatedMessage(event) {
  event.preventDefault();

  const nameEl = document.getElementById("senderName");
  const emailEl = document.getElementById("senderEmail");
  const subjectEl = document.getElementById("senderSubject");
  const messageEl = document.getElementById("senderMessage");
  const statusEl = document.getElementById("contactStatusMsg");
  const btnEl = document.getElementById("sendMsgBtn");

  const name = (nameEl.value || "").trim();
  const subject = (subjectEl.value || "").trim() || "رسالة من موقع k360";
  const message = (messageEl.value || "").trim();

  const check = validateKnownGmail(emailEl.value);
  if (!check.ok) {
    statusEl.style.color = "#c62828";
    statusEl.textContent = check.reason;
    emailEl.focus();
    return;
  }

  if (name.length < 3 || message.length < 5) {
    statusEl.style.color = "#c62828";
    statusEl.textContent = "يرجى إدخال اسم واضح ونص رسالة لا يقل عن 5 أحرف.";
    return;
  }

  btnEl.disabled = true;
  statusEl.style.color = "#0f4e9a";
  statusEl.textContent = "جاري الإرسال...";

  const payload = {
    name,
    email: check.email,
    _subject: subject,
    message,
    sentAt: new Date().toISOString()
  };

  fetch(`${CONTACT_FIREBASE_URL}/siteMessages.json`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  })
    .then(res => {
      if (!res.ok) throw new Error();
      nameEl.value = "";
      emailEl.value = "";
      subjectEl.value = "";
      messageEl.value = "";
      statusEl.style.color = "#2e7d32";
      statusEl.textContent = "تم إرسال رسالتك بنجاح.";
    })
    .catch(() => {
      statusEl.style.color = "#c62828";
      statusEl.textContent = "تعذر إرسال الرسالة حالياً، يرجى المحاولة لاحقاً.";
    })
    .finally(() => {
      btnEl.disabled = false;
    });
}
</script>
