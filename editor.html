<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نشر الأخبار تلقائياً - krater360</title>
  <style>
    body {
      font-family: Tahoma, Arial, sans-serif;
      background-color: #f4f6f9;
      color: #222;
      margin: 0;
      padding: 15px;
    }
    .box {
      max-width: 750px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    h1 {
      margin-top: 0;
      color: #0d47a1;
      font-size: 22px;
      border-bottom: 2px solid #e3f2fd;
      padding-bottom: 10px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-top: 14px;
      margin-bottom: 6px;
      font-size: 14px;
    }
    input, textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-family: Tahoma, Arial, sans-serif;
      font-size: 15px;
    }
    input[type="file"] {
      padding: 8px;
      background: #fafafa;
      font-size: 14px;
    }
    textarea {
      min-height: 130px;
      line-height: 1.7;
    }
    .preview-box {
      margin-top: 10px;
      display: none;
    }
    .preview-box img {
      max-width: 100%;
      max-height: 220px;
      border-radius: 6px;
      border: 1px solid #ddd;
    }
    .btn {
      margin-top: 16px;
      width: 100%;
      background-color: #1b5e20;
      color: #fff;
      border: none;
      padding: 13px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn:disabled {
      background-color: #888;
      cursor: not-allowed;
    }
    .msg {
      margin-top: 12px;
      font-weight: bold;
      font-size: 14px;
      line-height: 1.6;
    }
    .note {
      background: #e8f5e9;
      border-right: 4px solid #2e7d32;
      padding: 10px 12px;
      margin-top: 16px;
      font-size: 13px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>نشر الأخبار تلقائياً - krater360</h1>

    <label>مفتاح GitHub Token (يُحفظ في متصفحك فقط)</label>
    <input type="password" id="ghToken" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">

    <label>عنوان الخبر</label>
    <input type="text" id="title" placeholder="اكتب عنوان الخبر هنا...">

    <label>التاريخ</label>
    <input type="text" id="date" value="22 نوفمبر 2026">

    <label>رفع صورة من الهاتف (اختياري)</label>
    <input type="file" id="imageFile" accept="image/*">
    <div class="preview-box" id="previewBox">
      <img id="previewImg" alt="معاينة الصورة">
    </div>

    <label>أو رابط الصورة مباشرة (اختياري)</label>
    <input type="url" id="image" placeholder="https://example.com/image.jpg">

    <label>نص الخبر أو المقال</label>
    <textarea id="body" placeholder="اكتب تفاصيل الخبر أو المقال هنا..."></textarea>

    <button class="btn" id="publishBtn" onclick="publishNews()">نشر الخبر تلقائياً في الموقع</button>
    <div class="msg" id="statusMsg"></div>

    <div class="note">
      <strong>ملاحظة:</strong> يحدّث النظام تلقائياً بطاقات الأخبار، وشريط الأخبار المتحرك، ويضيف زر نسخ رابط مباشر لكل خبر جديد، كما يرفع صورة الهاتف تلقائياً إلى مجلد <code>images/</code> في المستودع عند اختيارها.
    </div>
  </div>

  <script>
    const OWNER = "krater360";
    const REPO = "krater360.github.io";
    const FILE_PATH = "index.html";
    const BRANCH = "main";

    const tokenInput = document.getElementById("ghToken");
    const fileInput = document.getElementById("imageFile");
    const imageUrlInput = document.getElementById("image");
    const previewBox = document.getElementById("previewBox");
    const previewImg = document.getElementById("previewImg");

    const savedToken = localStorage.getItem("krater360_gh_token");
    if (savedToken) tokenInput.value = savedToken;

    tokenInput.addEventListener("input", () => {
      localStorage.setItem("krater360_gh_token", tokenInput.value.trim());
    });

    fileInput.addEventListener("change", () => {
      const file = fileInput.files[0];
      if (!file) {
        previewBox.style.display = "none";
        previewImg.removeAttribute("src");
        return;
      }
      const reader = new FileReader();
      reader.onload = (e) => {
        previewImg.src = e.target.result;
        previewBox.style.display = "block";
      };
      reader.readAsDataURL(file);
    });

    function escapeHtml(text) {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function utf8ToBase64(str) {
      const bytes = new TextEncoder().encode(str);
      let bin = "";
      for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
      return btoa(bin);
    }

    function base64ToUtf8(b64) {
      const bin = atob(b64.replace(/\n/g, ""));
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return new TextDecoder().decode(bytes);
    }

    function fileToBase64Pure(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const result = String(reader.result || "");
          const parts = result.split(",");
          if (parts.length < 2) return reject(new Error("تعذر قراءة بيانات الصورة."));
          resolve(parts[1]);
        };
        reader.onerror = () => reject(new Error("حدث خطأ أثناء قراءة ملف الصورة من الهاتف."));
        reader.readAsDataURL(file);
      });
    }

    function sanitizeFileName(name) {
      const dotIdx = name.lastIndexOf(".");
      const rawBase = dotIdx > 0 ? name.slice(0, dotIdx) : name;
      const rawExt = dotIdx > 0 ? name.slice(dotIdx + 1).toLowerCase() : "jpg";
      const safeBase = rawBase.replace(/[^a-zA-Z0-9_-]/g, "").slice(0, 30) || "news-img";
      const safeExt = rawExt.replace(/[^a-z0-9]/g, "") || "jpg";
      return `${Date.now()}-${safeBase}.${safeExt}`;
    }

    async function uploadImageToGitHub(file, token) {
      const fileName = sanitizeFileName(file.name);
      const imagePath = `images/${fileName}`;
      const base64Content = await fileToBase64Pure(file);
      const uploadUrl = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${imagePath}`;

      const uploadRes = await fetch(uploadUrl, {
        method: "PUT",
        headers: {
          Authorization: `token ${token}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          message: `رفع صورة خبر: ${fileName}`,
          content: base64Content,
          branch: BRANCH
        })
      });

      if (!uploadRes.ok) {
        throw new Error("فشل رفع الصورة من الهاتف إلى مستودع GitHub.");
      }

      return `https://${OWNER}.github.io/${imagePath}`;
    }

    async function publishNews() {
      const token = tokenInput.value.trim();
      const title = escapeHtml(document.getElementById("title").value.trim());
      const date = escapeHtml(document.getElementById("date").value.trim());
      const manualImage = imageUrlInput.value.trim();
      const selectedFile = fileInput.files[0];
      const rawBody = document.getElementById("body").value.trim();
      const statusMsg = document.getElementById("statusMsg");
      const btn = document.getElementById("publishBtn");

      if (!token) {
        statusMsg.style.color = "#c62828";
        statusMsg.textContent = "يرجى إدخال مفتاح GitHub Token أولاً.";
        return;
      }
      if (!title || !rawBody) {
        statusMsg.style.color = "#c62828";
        statusMsg.textContent = "يرجى إدخال عنوان الخبر ونصه.";
        return;
      }

      btn.disabled = true;
      statusMsg.style.color = "#0d47a1";

      try {
        let finalImageUrl = manualImage;

        if (selectedFile) {
          statusMsg.textContent = "جاري رفع الصورة من الهاتف إلى GitHub...";
          finalImageUrl = await uploadImageToGitHub(selectedFile, token);
        }

        statusMsg.textContent = "جاري جلب ملف الموقع وتحديث البطاقة وشريط الأخبار...";

        const apiUrl = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE_PATH}`;
        const getRes = await fetch(apiUrl, {
          headers: { Authorization: `token ${token}` }
        });
        if (!getRes.ok) throw new Error("تعذر الوصول إلى الملف. تأكد من صحة Token وصلاحية repo.");

        const fileData = await getRes.json();
        let updatedHtml = base64ToUtf8(fileData.content);

        // 1. تحديث نص شريط الأخبار داخل <marquee>
        const marqueeRegex = /(<marquee[^>]*>)([\s\S]*?)(<\/marquee>)/i;
        if (marqueeRegex.test(updatedHtml)) {
          updatedHtml = updatedHtml.replace(marqueeRegex, (match, openTag, oldText, closeTag) => {
            const cleanOld = oldText.trim();
            const mergedText = cleanOld ? `${title}   ★   ${cleanOld}` : title;
            return `${openTag}\n    ${mergedText}\n  ${closeTag}`;
          });
        }

        // 2. إضافة دالة نسخ رابط الخبر مرة واحدة في الصفحة إن لم تكن موجودة
        if (!updatedHtml.includes("function copyNewsLink(")) {
          const copyScript = `\n<script>\nfunction copyNewsLink(id) {\n  const url = window.location.origin + window.location.pathname + "#" + id;\n  if (navigator.clipboard && navigator.clipboard.writeText) {\n    navigator.clipboard.writeText(url).then(() => alert("تم نسخ رابط الخبر"));\n  } else {\n    const temp = document.createElement("input");\n    temp.value = url;\n    document.body.appendChild(temp);\n    temp.select();\n    document.execCommand("copy");\n    document.body.removeChild(temp);\n    alert("تم نسخ رابط الخبر");\n  }\n}\n<\/script>\n`;
          if (updatedHtml.includes("</body>")) {
            updatedHtml = updatedHtml.replace("</body>", copyScript + "</body>");
          } else {
            updatedHtml += copyScript;
          }
        }

        // 3. تجهيز بطاقة الخبر الجديدة مع معرف فريد وزر نسخ الرابط
        const newsId = "news-" + Date.now();
        const paragraphs = rawBody
          .split(/\n+/)
          .map(p => `      <p>${escapeHtml(p.trim())}</p>`)
          .join("\n");

        const imgTag = finalImageUrl
          ? `\n      <img src="${escapeHtml(finalImageUrl)}" alt="${title}" style="width:100%; max-height:420px; object-fit:cover; border-radius:6px; margin-bottom:12px;">`
          : "";

        const newCard = `    <div class="news-card" id="${newsId}">${imgTag}
      <h2>${title}</h2>
      <div class="news-date">${date}</div>
${paragraphs}
      <button type="button" onclick="copyNewsLink('${newsId}')" style="margin-top:10px; background:#0d47a1; color:#fff; border:none; padding:6px 12px; border-radius:5px; font-size:13px; cursor:pointer;">نسخ رابط الخبر</button>
    </div>\n`;

        const containerMarker = '<div class="container">';
        const idx = updatedHtml.indexOf(containerMarker);
        if (idx === -1) throw new Error('لم يتم العثور على <div class="container"> داخل index.html.');

        const insertPos = idx + containerMarker.length;
        updatedHtml =
          updatedHtml.slice(0, insertPos) +
          "\n" +
          newCard +
          updatedHtml.slice(insertPos);

        const putRes = await fetch(apiUrl, {
          method: "PUT",
          headers: {
            Authorization: `token ${token}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: `نشر خبر: ${title}`,
            content: utf8ToBase64(updatedHtml),
            sha: fileData.sha,
            branch: BRANCH
          })
        });

        if (!putRes.ok) throw new Error("فشل حفظ التعديل في GitHub.");

        statusMsg.style.color = "#1b5e20";
        statusMsg.textContent = "تم نشر الخبر وإضافة زر نسخ الرابط بنجاح! سيظهر خلال دقيقة واحدة.";
        document.getElementById("title").value = "";
        imageUrlInput.value = "";
        fileInput.value = "";
        previewBox.style.display = "none";
        previewImg.removeAttribute("src");
        document.getElementById("body").value = "";
      } catch (err) {
        statusMsg.style.color = "#c62828";
        statusMsg.textContent = "خطأ: " + err.message;
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
