  <style>

<body class="k360-protected">
  <header class="k360-hero">
    <div class="k360-wrap">
      <div class="k360-brand-row">
        <div>
          <h1 class="k360-brand-title">krater360</h1>
          <p class="k360-brand-sub">تغطيات إخبارية وتحليلات مستمرة على مدار الساعة</p>
        </div>
        <div class="k360-top-actions">
          <button type="button" class="k360-chip-btn" onclick="loadLiveFeed(true)">🔄 تحديث الأخبار</button>
          <a href="#k360ContactSection" class="k360-chip-btn">📩 تواصل معنا</a>
        </div>
      </div>
      <a href="#newsFeed" class="k360-live-banner">البث المباشر — تغطية موقع krater360</a>
      <div class="k360-ticker-bar">
        <span class="k360-ticker-label">آخر الأخبار</span>
        <div class="k360-ticker-track">
          <div class="k360-ticker-move" id="newsTickerMove">جاري تحميل العناوين...</div>
        </div>
      </div>
    </div>
  </header>

  <main class="k360-wrap">
    <div class="k360-ads-grid" id="headerAdsBox"></div>
    <section id="newsFeed"><p style="text-align:center; color:#475569;">جاري تحميل الأخبار...</p></section>
    <section class="k360-contact-box" id="k360ContactSection">
      <h3>تواصل معنا أو أرسل تعليقاً</h3>
      <form id="k360ContactForm" onsubmit="submitValidatedMessage(event)">
        <div class="k360-field">
          <label for="senderName">الاسم الكامل</label>
          <input type="text" id="senderName" required minlength="3" placeholder="اكتب اسمك هنا">
        </div>
        <div class="k360-field">
          <label for="senderEmail">بريد Gmail المعروف</label>
          <input type="email" id="senderEmail" required placeholder="example@gmail.com">
        </div>
        <div class="k360-field">
          <label for="senderSubject">الموضوع</label>
          <input type="text" id="senderSubject" placeholder="مثال: تعليق أو استفسار">
        </div>
        <div class="k360-field">
          <label for="senderMessage">نص الرسالة أو التعليق</label>
          <textarea id="senderMessage" rows="3" required minlength="5" placeholder="اكتب رسالتك هنا..."></textarea>
        </div>
        <button type="submit" class="k360-submit-btn" id="sendMsgBtn">إرسال</button>
        <div class="k360-msg-status" id="contactStatusMsg"></div>
      </form>
    </section>
  </main>

<script>
const DB_URL = "https://krater360-2019f-default-rtdb.firebaseio.com";
const CACHE_POSTS_KEY = "k360_cached_posts_v1";
const CACHE_VIEWS_KEY = "k360_cached_views_v1";
const CACHE_ADS_KEY = "k360_cached_ads_v1";

function escapeText(str) {
  return String(str || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function enableCopyProtection() {
  document.addEventListener("contextmenu", e => {
    if (!e.target.closest("input, textarea")) e.preventDefault();
  });
  document.addEventListener("copy", e => {
    if (!e.target.closest("input, textarea")) e.preventDefault();
  });
  document.addEventListener("cut", e => {
    if (!e.target.closest("input, textarea")) e.preventDefault();
  });
  document.addEventListener("dragstart", e => {
    if (e.target.tagName === "IMG") e.preventDefault();
  });
  document.addEventListener("keydown", e => {
    const insideField = !!e.target.closest("input, textarea");
    if (!insideField && (e.ctrlKey || e.metaKey) && ["c", "u", "s", "a"].includes(String(e.key || "").toLowerCase())) {
      e.preventDefault();
    }
  });
}

function syncShareMetaForPost(post) {
  if (!post) return;
  const fallbackImg = "https://krater360.github.io/images/logo.png";
  const imgUrl = (post.img && String(post.img).trim()) ? String(post.img).trim() : fallbackImg;
  const titleText = (post.title && String(post.title).trim()) ? String(post.title).trim() : "krater360";
  const descText = Array.isArray(post.paragraphs) && post.paragraphs.length
    ? String(post.paragraphs[0]).trim()
    : "تغطيات إخبارية وتحليلات مستمرة على مدار الساعة.";

  const setMeta = (selector, attr, val) => {
    let el = document.querySelector(selector);
    if (!el) {
      el = document.createElement("meta");
      if (selector.includes("property=")) el.setAttribute("property", selector.match(/property="([^"]+)"/)[1]);
      else if (selector.includes("name=")) el.setAttribute("name", selector.match(/name="([^"]+)"/)[1]);
      document.head.appendChild(el);
    }
    el.setAttribute(attr, val);
  };

  setMeta('meta[property="og:title"]', "content", titleText);
  setMeta('meta[property="og:description"]', "content", descText);
  setMeta('meta[property="og:image"]', "content", imgUrl);
  setMeta('meta[property="og:image:secure_url"]', "content", imgUrl);
  setMeta('meta[name="twitter:image"]', "content", imgUrl);
}

function copySingleLink(postId) {
  const link = `https://krater360.github.io/?post=${encodeURIComponent(postId)}`;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(link).then(() => alert("تم نسخ رابط الخبر"));
  }
}

function recordPostView(postId) {
  if (!postId) return;
  const viewedKey = "k360_viewed_" + postId;
  if (sessionStorage.getItem(viewedKey)) return;
  sessionStorage.setItem(viewedKey, "1");

  fetch(`${DB_URL}/views/${encodeURIComponent(postId)}.json`)
    .then(r => r.json())
    .then(current => {
      const nextVal = (Number(current) || 0) + 1;
      return fetch(`${DB_URL}/views/${encodeURIComponent(postId)}.json`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(nextVal)
      });
    })
    .catch(() => {});
}
}

function renderTicker(list) {
  const tickerEl = document.getElementById("newsTickerMove");
  if (!tickerEl) return;
  if (!list || !list.length) {
    tickerEl.textContent = "أهلاً بكم في منصة krater360 الإخبارية";
    return;
  }
  tickerEl.innerHTML = list.slice(0, 10).map(p => {
    const id = encodeURIComponent(p.id || "");
    const title = escapeText(p.title || "خبر");
    return `<a href="?post=${id}">• ${title}</a>`;
  }).join("");
}

function renderAds(adsData) {
  const box = document.getElementById("headerAdsBox");
  if (!box || !adsData) return;
  const slots = [adsData.right, adsData.left].filter(a => a && (a.text || a.img));
  if (!slots.length) {
    box.style.display = "none";
    return;
  }
  box.style.display = "grid";
  box.innerHTML = slots.map(ad => {
    const imgHtml = ad.img ? `<img src="${escapeText(ad.img)}" alt="" loading="lazy">` : "";
    const textHtml = `<span>${escapeText(ad.text || "")}</span>`;
    const inner = ad.url
      ? `<a href="${escapeText(ad.url)}" target="_blank" rel="noopener noreferrer">${imgHtml}${textHtml}</a>`
      : `<div>${imgHtml}${textHtml}</div>`;
    return `<div class="k360-ad-card">${inner}</div>`;
  }).join("");
}

function renderNews(postsData, viewsData) {
  const feedEl = document.getElementById("newsFeed");
  if (!feedEl) return;

  if (!postsData || typeof postsData !== "object") {
    renderTicker([]);
    feedEl.innerHTML = "<p style='text-align:center; color:#64748b;'>لا توجد أخبار منشورة حالياً.</p>";
    return;
  }

  const viewsMap = (viewsData && typeof viewsData === "object") ? viewsData : {};
  const params = new URLSearchParams(window.location.search);
  const targetPostId = params.get("post");

  let list = Object.entries(postsData)
    .map(([key, val]) => ({ ...(val || {}), id: (val && val.id) || key }))
    .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

  renderTicker(list);

  let displayList = list;
  if (targetPostId && postsData[targetPostId]) {
    displayList = [{ ...(postsData[targetPostId] || {}), id: targetPostId }];
    syncShareMetaForPost(displayList[0]);
    recordPostView(targetPostId);
  } else if (list[0]) {
    syncShareMetaForPost(list[0]);
  }

  feedEl.innerHTML = displayList.map(post => {
    const id = post.id || "";
    const title = escapeText(post.title || "بدون عنوان");
    const date = escapeText(post.date || "");
    const views = Number(viewsMap[id]) || 0;
    const imgHtml = (post.img && String(post.img).trim())
      ? `<div class="k360-news-media"><img src="${escapeText(post.img)}" alt="${title}" loading="lazy"></div>`
      : "";
    const paragraphs = Array.isArray(post.paragraphs)
      ? post.paragraphs
      : String(post.body || "").split(/\n+/).filter(Boolean);
    const bodyHtml = paragraphs.map(p => `<p>${escapeText(p)}</p>`).join("");

    return `
      <article class="k360-news-card" id="${escapeText(id)}">
        <div class="k360-news-topbar">
          <span class="k360-news-badge">krater360</span>
          <span>${date}</span>
        </div>
        <div class="k360-news-body">
          <h2 class="k360-news-title">${title}</h2>
          ${imgHtml}
          <div class="k360-news-text">${bodyHtml}</div>
        </div>
        <div class="k360-news-footer">
          <span>المشاهدات: <strong>${views}</strong></span>
          <button type="button" class="k360-copy-mini" onclick="copySingleLink('${escapeText(id)}')">نسخ الرابط</button>
        </div>
      </article>
    `;
  }).join("");
}

function loadLiveFeed(showToast = false) {
  const cachedPosts = JSON.parse(localStorage.getItem(CACHE_POSTS_KEY) || "null");
  const cachedViews = JSON.parse(localStorage.getItem(CACHE_VIEWS_KEY) || "null");
  const cachedAds = JSON.parse(localStorage.getItem(CACHE_ADS_KEY) || "null");

  if (cachedAds) renderAds(cachedAds);
  if (cachedPosts) renderNews(cachedPosts, cachedViews);

  Promise.all([
    fetch(`${DB_URL}/posts.json`).then(r => r.json()).catch(() => cachedPosts),
    fetch(`${DB_URL}/views.json`).then(r => r.json()).catch(() => cachedViews),
    fetch(`${DB_URL}/settings/headerAds.json`).then(r => r.json()).catch(() => cachedAds)
  ]).then(([postsData, viewsData, adsData]) => {
    if (postsData) localStorage.setItem(CACHE_POSTS_KEY, JSON.stringify(postsData));
    if (viewsData) localStorage.setItem(CACHE_VIEWS_KEY, JSON.stringify(viewsData));
    if (adsData) localStorage.setItem(CACHE_ADS_KEY, JSON.stringify(adsData));
    renderAds(adsData);
    renderNews(postsData, viewsData);
    if (showToast) alert("تم تحديث الأخبار");
  });
}

function validateKnownGmail(rawEmail) {
  const email = String(rawEmail || "").trim().toLowerCase();
  if (!email.endsWith("@gmail.com")) return { ok: false, reason: "يُسمح فقط ببريد @gmail.com." };
  const parts = email.split("@");
  if (parts.length !== 2) return { ok: false, reason: "صيغة البريد غير صحيحة." };
  const localPart = parts[0];
  if (!/^[a-z0-9._-]+$/.test(localPart)) return { ok: false, reason: "البريد يحتوي على رموز غير مسموحة." };
  if (localPart.startsWith(".") || localPart.endsWith(".") || localPart.includes("..")) return { ok: false, reason: "تنسيق النقاط غير صحيح." };
  if (localPart.length < 4) return { ok: false, reason: "البريد قصير جداً." };
  if (/^\d+$/.test(localPart)) return { ok: false, reason: "لا يُقبل بريد أرقام فقط." };
  if (/(.)\1{3,}/.test(localPart)) return { ok: false, reason: "البريد يبدو عشوائياً." };
  const blocked = ["test", "fake", "spam", "temp", "dummy", "asdf", "qwerty", "abc", "abcd", "1234", "12345", "noreply", "no-reply", "admin", "user"];
  if (blocked.some(w => localPart === w || localPart.includes(w))) return { ok: false, reason: "يرجى استخدام بريد Gmail معروف." };
  return { ok: true, email };
}

function submitValidatedMessage(event) {
  event.preventDefault();
  const nameEl = document.getElementById("senderName");
  const emailEl = document.getElementById("senderEmail");
  const subjectEl = document.getElementById("senderSubject");
  const messageEl = document.getElementById("senderMessage");
  const statusEl = document.getElementById("contactStatusMsg");
  const btnEl = document.getElementById("sendMsgBtn");

  const name = (nameEl.value || "").trim();
  const subject = (subjectEl.value || "").trim() || "رسالة من موقع k360";
  const message = (messageEl.value || "").trim();
  const check = validateKnownGmail(emailEl.value);

  if (!check.ok) {
    statusEl.style.color = "#c62828";
    statusEl.textContent = check.reason;
    return;
  }
  if (name.length < 3 || message.length < 5) {
    statusEl.style.color = "#c62828";
    statusEl.textContent = "يرجى إدخال اسم واضح ونص لا يقل عن 5 أحرف.";
    return;
  }

  btnEl.disabled = true;
  statusEl.style.color = "#0f4e9a";
  statusEl.textContent = "جاري الإرسال...";

  fetch(`${DB_URL}/siteMessages.json`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name, email: check.email, _subject: subject, message, sentAt: new Date().toISOString() })
  })
    .then(r => {
      if (!r.ok) throw new Error();
      nameEl.value = "";
      emailEl.value = "";
      subjectEl.value = "";
      messageEl.value = "";
      statusEl.style.color = "#2e7d32";
      statusEl.textContent = "تم إرسال رسالتك بنجاح.";
    })
    .catch(() => {
      statusEl.style.color = "#c62828";
      statusEl.textContent = "تعذر الإرسال حالياً.";
    })
    .finally(() => { btnEl.disabled = false; });
}

enableCopyProtection();
loadLiveFeed(false);
</script>
